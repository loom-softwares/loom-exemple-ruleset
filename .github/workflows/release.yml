name: Release Loom package

# Push a tag like v1.2.3 -> builds the package zip, stamps the version into the
# manifest and publishes the release (zip + manifest) the way the Loom installer
# expects: <repo>/releases/latest/download/<manifest>.json and the zip as asset.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The demo has no lockfile and no dependencies: no npm cache, no npm ci.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Resolve version
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not semver (expected vMAJOR.MINOR.PATCH)"; exit 1
          fi
          if [ -f ruleset.json ]; then MANIFEST=ruleset.json; elif [ -f addon.json ]; then MANIFEST=addon.json; else echo "No ruleset.json/addon.json at repo root"; exit 1; fi
          NAME=$(node -p "require('./$MANIFEST').name")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Runs before the version is stamped, so the manifest is checked as committed.
      - name: Run tests
        run: npm test

      - name: Stamp version into manifest
        env:
          MANIFEST: ${{ steps.v.outputs.manifest }}
          VERSION: ${{ steps.v.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
            m.version = process.env.VERSION;
            m.manifest = `https://github.com/${process.env.REPO}/releases/latest/download/${process.env.MANIFEST}`;
            fs.writeFileSync(process.env.MANIFEST, JSON.stringify(m, null, 2) + "\n");
          '

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            node -e '
              const fs = require("fs");
              const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n").map(l => l.replace("\r", ""));
              const ver = process.env.VERSION;
              const start = lines.findIndex(l => l.startsWith("##") && [ver, "[" + ver + "]", "v" + ver, "[v" + ver + "]"].includes(l.slice(2).trim().split(" ")[0]));
              if (start === -1) process.exit(0);
              let end = lines.findIndex((l, i) => i > start && /^##\s/.test(l));
              if (end === -1) end = lines.length;
              fs.writeFileSync("release-notes.md", lines.slice(start + 1, end).join("\n").trim() + "\n");
            '
          fi
          if [ -s release-notes.md ]; then echo "Changelog entry found for ${VERSION}"; else echo "No changelog entry for ${VERSION}; falling back to generated notes"; fi

      - name: Build package zip
        env:
          NAME: ${{ steps.v.outputs.name }}
        run: |
          zip -r "${NAME}.zip" . \
            -x '.git/*' '.github/*' '.agents/*' '.dev/*' '.planning/*' '.codex/*' '.vite/*' 'node_modules/*' 'packs/source/*' \
               './.git/*' './.github/*' './.agents/*' './.dev/*' './.planning/*' './.codex/*' './.vite/*' './node_modules/*' './packs/source/*' \
               'tests/*' './tests/*' 'i18n/*' './i18n/*' 'scripts/*' './scripts/*' \
               'package.json' 'package-lock.json' \
               '.gitignore' '.gitattributes' '*.zip' 'release-notes.md' 'release-manifest.json'

      - name: Verify package contents
        env:
          NAME: ${{ steps.v.outputs.name }}
          MANIFEST: ${{ steps.v.outputs.manifest }}
        run: |
          unzip -t "${NAME}.zip"
          node scripts/verify-package.mjs "${NAME}.zip" "$MANIFEST"

      - name: Build release manifest (adds download URL + sha256)
        env:
          MANIFEST: ${{ steps.v.outputs.manifest }}
          NAME: ${{ steps.v.outputs.name }}
          TAG: ${{ steps.v.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const m = JSON.parse(fs.readFileSync(process.env.MANIFEST, "utf8"));
            const zip = `${process.env.NAME}.zip`;
            m.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/${zip}`;
            m.sha256 = crypto.createHash("sha256").update(fs.readFileSync(zip)).digest("hex");
            fs.writeFileSync("release-manifest.json", JSON.stringify(m, null, 2) + "\n");
          '
          mv release-manifest.json "${MANIFEST}.release"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            ${{ steps.v.outputs.name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload manifest asset under its real name
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST: ${{ steps.v.outputs.manifest }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          mkdir -p out && cp "${MANIFEST}.release" "out/${MANIFEST}"
          gh release upload "$TAG" "out/${MANIFEST}" --clobber

      - name: Publish package version to Loom Hub
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          const requestUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          requestUrl.searchParams.set('audience', 'urn:loomsite:package-release');
          const tokenResponse = await fetch(requestUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` }
          });
          if (!tokenResponse.ok) throw new Error(`GitHub OIDC token request failed (${tokenResponse.status}).`);
          const { value: token } = await tokenResponse.json();
          const response = await fetch('https://loomvtt.com/api/publish-package-release', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              repository: process.env.RELEASE_REPOSITORY,
              tag: process.env.RELEASE_TAG,
            })
          });
          const text = await response.text();
          console.log(`Loom Hub response (${response.status}): ${text}`);
          if (!response.ok) throw new Error(`Loom Hub version publish failed (${response.status}). The GitHub release is already published.`);
          const result = JSON.parse(text || "{}");
          console.log(`Loom Hub catalog updated for ${result.version}.`);
          NODE

      - name: Sync version back to default branch (best effort)
        continue-on-error: true
        env:
          MANIFEST: ${{ steps.v.outputs.manifest }}
          TAG: ${{ steps.v.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "$MANIFEST" /tmp/manifest.stamped
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B sync-version "origin/$DEFAULT_BRANCH"
          cp /tmp/manifest.stamped "$MANIFEST"
          git add "$MANIFEST"
          git diff --cached --quiet || { git commit -m "chore: release ${TAG}"; git push origin "HEAD:${DEFAULT_BRANCH}"; }
